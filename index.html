<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة متابعة الطلبات</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#eceff3;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#d9dfe7;--navy:#14213d;--amb:#f2a900;--grn:#1b9a6c;--red:#d64545;--tea:#1f7a8c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#172033;--ink:#e8edf6;--mut:#9aa7bb;--line:#2a3750}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI',Tahoma,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px 26px;border-bottom:8px solid var(--amb);border-image:repeating-linear-gradient(135deg,#f2a900 0 14px,#14213d 14px 28px) 8}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;opacity:.8}
main{max-width:1280px;margin:14px auto 40px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
button.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-within{outline:3px solid var(--amb);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.mut{color:var(--mut);font-size:13px}
.drop{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:10px;padding:18px;cursor:pointer;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:820px){.kpis{grid-template-columns:repeat(6,1fr)}.grid{grid-template-columns:1fr 1fr!important}}
.k{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--navy));border-radius:10px;padding:10px 12px}
.k small{color:var(--mut);display:block;font-size:12px}
.k b{font-size:24px;line-height:1.3;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.ch{height:280px;position:relative}
.tw{overflow:auto;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
th{background:var(--bg);position:sticky;top:0;cursor:pointer}
.hidden{display:none!important}
@media print{header button,.bar button,.drop,.tw{display:none}}
</style>
</head>
<body>
<header>
<h1>لوحة متابعة الطلبات</h1>
<p>ارفع ملف الطلبات وهتشوف نسب التسليم وسرعة التجهيز والطلبات المتأخرة جاهزة.</p>
</header>
<main>
<section class="card"><div class="row">
<label class="drop" id="drop"><input type="file" id="file" accept=".csv,text/csv" hidden><b>اختار ملف CSV</b><small class="mut" id="st">أو اسحب الملف هنا</small></label>
<div><label for="url">رابط Google Sheets (اختياري)</label><input id="url" placeholder="الصق الرابط هنا"><div class="bar"><button onclick="sheet()">تحميل الشيت</button><button class="s" onclick="sample()">جرّب بيانات مثال</button></div></div>
</div></section>

<div id="app" class="hidden">
<section class="card"><div class="row">
<div><label for="q">بحث</label><input id="q" placeholder="اكتب أي كلمة"></div>
<div id="dw"><label for="d1">من تاريخ</label><input type="date" id="d1"></div>
<div id="dw2"><label for="d2">إلى تاريخ</label><input type="date" id="d2"></div>
<div id="fw"><label for="fc">فلتر حسب</label><select id="fc"></select></div>
<div id="fvw"><label for="fv">القيمة</label><select id="fv"></select></div>
</div>
<div class="bar"><span id="cnt" class="mut"></span><button class="s" onclick="reset()">مسح الفلاتر</button></div></section>

<div class="kpis" id="kp"></div>

<div class="grid">
<div class="card" id="c1"><h3 id="t1"></h3><div class="ch"><canvas id="g1"></canvas></div></div>
<div class="card" id="c2"><h3>عدد الطلبات كل يوم</h3><div class="ch"><canvas id="g2"></canvas></div></div>
<div class="card" id="c3"><h3>متوسط الوقت بين المراحل (بالساعات)</h3><div class="ch"><canvas id="g3"></canvas></div></div>
<div class="card" id="c4"><h3>رسم حسب اختيارك</h3>
<div class="row"><div><label for="cd">التصنيف</label><select id="cd"></select></div><div><label for="cm">الرقم</label><select id="cm"></select></div>
<div><label for="ca">الحساب</label><select id="ca"><option value="sum">المجموع</option><option value="avg">المتوسط</option><option value="count">العدد</option></select></div>
<div><label for="ct">الشكل</label><select id="ct"><option value="bar">أعمدة</option><option value="line">خط</option><option value="doughnut">دائري</option></select></div>
<div><label for="cn">عدد التصنيفات</label><select id="cn"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="0">الكل</option></select></div></div>
<div class="ch" style="margin-top:10px"><canvas id="g4"></canvas></div></div>
</div>

<section class="card"><h3>البيانات</h3>
<div class="bar" style="justify-content:flex-start;margin:0 0 8px"><button onclick="exp(0)">تصدير النتائج CSV</button><button class="s" onclick="exp(1)">تصدير الكل CSV</button><button class="s" onclick="window.print()">طباعة / PDF</button></div>
<div class="tw" id="tw"></div><div class="bar" id="pg"></div></section>
</div>
</main>

<script>
const $=i=>document.getElementById(i),p=n=>String(n).padStart(2,'0'),
P=['#14213d','#f2a900','#1f7a8c','#1b9a6c','#d64545','#7b5ea7','#84a98c','#e07a5f'],
ST=[['created',/^order created/i,'إنشاء الطلب'],['picked',/picked/i,'الالتقاط'],['packed',/packed/i,'التعبئة'],['shipped',/^order shipped/i,'الشحن'],['delivered',/delivered/i,'التسليم']],
EX=[['returned',/^order returned/i,'مرتجع'],['cancelled',/cancel/i,'ملغي']];
let H=[],R=[],F=[],T={},S=[],X=[],MD=null,C={},sort={k:null,d:1},page=0;

function pd(v){v=String(v||'').trim();let m=v.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
 if(m)return new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
 m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:[ T](\d{1,2}):(\d{2}))?/);
 return m?new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):null}
function dt(r,h){const c=r._d||(r._d={});return h in c?c[h]:(c[h]=pd(r[h]))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const fh=h=>h==null?'—':h<48?h.toFixed(1)+' ساعة':(h/24).toFixed(1)+' يوم';

function detect(){T={};const s=R.slice(0,5000);
 H.forEach(h=>{const v=s.map(r=>String(r[h]??'').trim()).filter(Boolean);
  if(!v.length){T[h]='empty';return}
  const u=new Set(v).size;
  if(v.filter(x=>pd(x)).length/v.length>.8)T[h]='date';
  else if(/(^|[\s_-])(id|reference|ref|code|sku|barcode|phone|awb|tracking)([\s_-]|$)/i.test(h))T[h]='id';
  else if(v.filter(x=>isFinite(+x.replace(/,/g,''))).length/v.length>.8)T[h]=v.every(x=>/^\d+$/.test(x))&&u>.95*v.length&&v.length>20?'id':'num';
  else T[h]=u<=40&&v.length/s.length>.3?'cat':'text'})}

function load(text){const r=Papa.parse(text.replace(/^\ufeff/,''),{header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim()});
 if(!r.data.length)throw Error('الملف فاضي أو شكله مش مفهوم');
 H=r.meta.fields;R=r.data;detect();init()}
function go(fn){try{fn();$('st').textContent='تم تحميل '+R.length+' صف'}catch(e){$('st').textContent='خطأ: '+e.message}}
function rd(f){if(!f)return;$('st').textContent='جاري القراءة...';const r=new FileReader();r.onload=()=>go(()=>load(r.result));r.readAsText(f,'UTF-8')}
$('file').onchange=e=>rd(e.target.files[0]);
['dragover','drop'].forEach(e=>$('drop').addEventListener(e,ev=>{ev.preventDefault();if(e==='drop')rd(ev.dataTransfer.files[0])}));
async function sheet(){try{const u=new URL($('url').value.trim());
 const m=u.pathname.match(/\/spreadsheets\/d\/([\w-]+)/);if(!u.hostname.includes('google.com')||!m)throw Error('الرابط مش رابط شيت صحيح');
 const g=u.searchParams.get('gid')||(u.hash.match(/gid=(\d+)/)||[])[1]||'0';
 $('st').textContent='جاري تحميل الشيت...';
 const r=await fetch(`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${g}`);
 if(!r.ok)throw Error('الشيت لازم يكون متاح لأي حد معاه الرابط');
 const t=await r.text();if(/<html/i.test(t))throw Error('الشيت خاص، نزّله CSV وارفعه');
 go(()=>load(t))}catch(e){$('st').textContent='خطأ: '+e.message}}

function sample(){const hd=['ORDER ID','ORDER CREATED AT','ORDER PICKED AT','ORDER PACKED AT','ORDER SHIPPED AT','ORDER DELIVERED AT','ORDER RETURNED AT','SALES CHANNEL','HUB'],
 ch=['Noon','Amazon','Shopify','Salla'],hb=['القاهرة','الإسكندرية','العاشر من رمضان'],rows=[hd],
 f=d=>`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,
 rnd=(a,b)=>a+Math.random()*(b-a);
 for(let i=0;i<300;i++){let d=new Date(2026,8,1+Math.floor(rnd(0,14)),Math.floor(rnd(8,22)),Math.floor(rnd(0,60)));
  const row=[48000000+i*37,f(d)],add=h=>{d=new Date(+d+h*36e5);return f(d)};
  const stop=Math.random(),n=stop<.1?1:stop<.2?2:stop<.3?3:stop<.4?4:5;
  row.push(n>=2?add(rnd(1,10)):'',n>=3?add(rnd(.5,6)):'',n>=4?add(rnd(2,30)):'',n>=5?add(rnd(20,90)):'');
  row.push(n>=5&&Math.random()<.08?add(rnd(24,100)):'',ch[i%4],hb[i%3]);rows.push(row)}
 go(()=>load(Papa.unparse(rows)))}

function fill(id,arr,first){const s=$(id);s.replaceChildren();
 if(first!==undefined){const o=document.createElement('option');o.value='';o.textContent=first;s.appendChild(o)}
 arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})}
function init(){
 S=ST.map(s=>({k:s[0],l:s[2],h:H.find(h=>s[1].test(h)&&T[h]==='date')})).filter(s=>s.h);
 X=EX.map(s=>({k:s[0],l:s[2],h:H.find(h=>s[1].test(h)&&T[h]==='date')})).filter(s=>s.h);
 MD=S.length?S[0].h:H.find(h=>T[h]==='date')||null;
 const cats=H.filter(h=>T[h]==='cat'),nums=H.filter(h=>T[h]==='num'),m=getComputedStyle(document.documentElement);
 Chart.defaults.color=m.getPropertyValue('--mut').trim();Chart.defaults.borderColor=m.getPropertyValue('--line').trim();
 Chart.defaults.maintainAspectRatio=false;Chart.defaults.font.family="'Segoe UI',Tahoma,sans-serif";
 fill('fc',cats,'بدون فلتر');fill('fv',[],'كل القيم');fill('cd',cats);fill('cm',nums,'عدد السجلات');
 ['c4','fw','fvw'].forEach(i=>$(i).classList.toggle('hidden',!cats.length));
 ['dw','dw2','c2'].forEach(i=>$(i).classList.toggle('hidden',!MD));
 $('c3').classList.toggle('hidden',S.length<3);
 $('c1').classList.toggle('hidden',S.length<3&&!cats.length);
 $('app').classList.remove('hidden');reset()}
function fillv(){const c=$('fc').value;fill('fv',c?[...new Set(R.map(r=>String(r[c]).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')):[],'كل القيم')}
function reset(){$('q').value=$('d1').value=$('d2').value='';$('fc').value='';fillv();apply()}
['q','d1','d2'].forEach(i=>$(i).oninput=apply);
$('fc').onchange=()=>{fillv();apply()};$('fv').onchange=apply;
['cd','cm','ca','ct','cn'].forEach(i=>$(i).onchange=cust);

function apply(){const q=$('q').value.trim().toLowerCase(),a=$('d1').value,b=$('d2').value,c=$('fc').value,v=$('fv').value,
 A=a?new Date(a+'T00:00'):null,B=b?new Date(b+'T23:59'):null;
 F=R.filter(r=>{if(c&&v&&String(r[c]).trim()!==v)return false;
  if(MD&&(A||B)){const d=dt(r,MD);if(!d||(A&&d<A)||(B&&d>B))return false}
  return !q||H.some(h=>String(r[h]??'').toLowerCase().includes(q))});
 page=0;draw()}
function draw(){$('cnt').textContent=F.length+' من '+R.length+' سجل';kpis();charts();table()}

function cnt(h){return F.filter(r=>dt(r,h)).length}
function gap(a,b){let s=0,n=0;F.forEach(r=>{const x=dt(r,a),y=dt(r,b);if(x&&y&&y>=x){s+=y-x;n++}});return n?s/n/36e5:null}
function kpis(){const n=F.length,k=[],pc=x=>n?(x/n*100).toFixed(1)+'%':'0%',f=key=>S.find(s=>s.k===key),e=key=>X.find(s=>s.k===key);
 k.push(['إجمالي الطلبات',nf(n),'--navy']);
 if(S.length>=3){const d=f('delivered'),sh=f('shipped'),rt=e('returned'),cn=e('cancelled');
  if(d)k.push(['نسبة التسليم',pc(cnt(d.h)),'--grn']);
  if(rt)k.push(['نسبة المرتجع',pc(cnt(rt.h)),'--red']);
  if(cn)k.push(['نسبة الإلغاء',pc(cnt(cn.h)),'--amb']);
  if(sh){k.push(['متوسط الإنشاء للشحن',fh(gap(S[0].h,sh.h)),'--tea']);
   k.push(['لسه ما اتشحنش',nf(F.filter(r=>dt(r,S[0].h)&&!dt(r,sh.h)&&!(cn&&dt(r,cn.h))).length),'--amb'])}
 }else{k.push(['عدد الأعمدة',H.length,'--tea']);
  const nm=H.find(h=>T[h]==='num');if(nm){const v=F.map(r=>+String(r[nm]).replace(/,/g,'')).filter(isFinite);
   const t=v.reduce((a,b)=>a+b,0);k.push(['مجموع '+nm,nf(t),'--grn']);k.push(['متوسط '+nm,nf(v.length?t/v.length:0),'--amb'])}}
 $('kp').innerHTML=k.map(x=>`<div class="k" style="--c:var(${x[2]})"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('')}

function mk(id,cfg){if(C[id])C[id].destroy();C[id]=new Chart($(id),cfg)}
function charts(){const nl={plugins:{legend:{display:false}}};
 if(S.length>=3){const v=S.map(s=>cnt(s.h)),tot=v[0]||1;$('t1').textContent='مسار الطلب: كام طلب وصل لكل مرحلة';
  mk('g1',{type:'bar',data:{labels:S.map((s,i)=>s.l+' ('+(v[i]/tot*100).toFixed(0)+'%)'),datasets:[{data:v,backgroundColor:P}]},options:{indexAxis:'y',...nl}});
  const pr=[],vl=[];for(let i=1;i<S.length;i++){pr.push(S[i-1].l+' → '+S[i].l);vl.push(gap(S[i-1].h,S[i].h))}
  mk('g3',{type:'bar',data:{labels:pr,datasets:[{data:vl,backgroundColor:P[1]}]},options:{...nl,scales:{y:{beginAtZero:true,title:{display:true,text:'ساعات'}}}}})}
 else{const c=H.find(h=>T[h]==='cat');if(c){$('t1').textContent='توزيع السجلات حسب '+c;const m=new Map();
  F.forEach(r=>{const k=String(r[c]).trim()||'(فارغ)';m.set(k,(m.get(k)||0)+1)});const a=[...m].sort((x,y)=>y[1]-x[1]).slice(0,8);
  mk('g1',{type:'doughnut',data:{labels:a.map(x=>x[0]),datasets:[{data:a.map(x=>x[1]),backgroundColor:P}]},options:{plugins:{legend:{position:'bottom'}}}})}}
 if(MD){const m=new Map();F.forEach(r=>{const d=dt(r,MD);if(d){const k=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());m.set(k,(m.get(k)||0)+1)}});
  const ks=[...m.keys()].sort();
  mk('g2',{type:'line',data:{labels:ks.map(k=>k.slice(5)),datasets:[{data:ks.map(k=>m.get(k)),borderColor:P[2],backgroundColor:'#1f7a8c22',fill:true,tension:.3}]},options:nl})}
 cust()}
function cust(){const d=$('cd').value;if(!d)return;const m=$('cm').value,a=$('ca').value,t=$('ct').value,n=+$('cn').value,g=new Map();
 F.forEach(r=>{const k=String(r[d]).trim()||'(فارغ)',e=g.get(k)||{s:0,c:0,v:0};e.c++;
  if(m&&String(r[m]).trim()!==''){const x=+String(r[m]).replace(/,/g,'');if(isFinite(x)){e.s+=x;e.v++}}g.set(k,e)});
 let z=[...g].map(([k,e])=>[k,a==='count'||!m?e.c:a==='avg'?(e.v?e.s/e.v:0):e.s]).sort((x,y)=>y[1]-x[1]);if(n)z=z.slice(0,n);
 mk('g4',{type:t,data:{labels:z.map(x=>x[0]),datasets:[{data:z.map(x=>x[1]),backgroundColor:t==='line'?P[2]:z.map((_,i)=>P[i%P.length]),borderColor:P[2],tension:.3}]},options:{plugins:{legend:{display:t==='doughnut',position:'bottom'}}}})}

function so(i){const k=H[i];sort=sort.k===k?{k,d:-sort.d}:{k,d:1};page=0;table()}
function table(){let d=F;const k=sort.k;
 if(k){const g=r=>T[k]==='date'?+dt(r,k)||0:T[k]==='num'?+String(r[k]).replace(/,/g,'')||0:String(r[k]??'');
  d=[...F].sort((a,b)=>(g(a)>g(b)?1:g(a)<g(b)?-1:0)*sort.d)}
 const per=50,pages=Math.max(1,Math.ceil(d.length/per));page=Math.min(page,pages-1);
 $('tw').innerHTML='<table><thead><tr>'+H.map((h,i)=>`<th onclick="so(${i})">${esc(h)}${k===h?(sort.d>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
  d.slice(page*per,page*per+per).map(r=>'<tr>'+H.map(h=>`<td>${esc(r[h])}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
 $('pg').innerHTML=`<button class="s" ${page?'':'disabled'} onclick="page--;table()">السابق</button><span class="mut">صفحة ${page+1} من ${pages}</span><button class="s" ${page<pages-1?'':'disabled'} onclick="page++;table()">التالي</button>`}
function exp(all){const d=all?R:F,a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+Papa.unparse({fields:H,data:d.map(r=>H.map(h=>r[h]))})],{type:'text/csv;charset=utf-8'}));
 a.download=all?'all-data.csv':'filtered-data.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script>
</body>
</html>
